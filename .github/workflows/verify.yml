name: Verify EdgeAtlas
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.lock.txt
      - run: npm ci && npm run build && npm run format:check
      - run: python run.py warm-model
      - name: Wait for Qdrant Server
        run: |
          python - <<'PY'
          import time, httpx
          for i in range(30):
              try:
                  if httpx.get('http://127.0.0.1:6333/healthz').is_success: break
              except httpx.HTTPError: pass
              time.sleep(1)
          else: raise SystemExit('Qdrant did not become ready')
          PY
      - run: python run.py test
        env: {HF_HUB_OFFLINE: '1'}
