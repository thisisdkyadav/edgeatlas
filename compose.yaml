services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - qdrant-data:/qdrant/storage
  cloud:
    build: .
    command: ['python', 'run.py', 'cloud']
    environment:
      CLOUD_HOST: 0.0.0.0
      CLOUD_PORT: 4200
      QDRANT_URL: http://qdrant:6333
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:?Set a custom EDGE_SYNC_TOKEN in .env}
      CLOUD_DATA_DIR: /app/data/cloud
    ports:
      - '127.0.0.1:4200:4200'
    volumes:
      - cloud-data:/app/data
    depends_on: [qdrant]
  edge:
    build: .
    environment:
      EDGE_HOST: 0.0.0.0
      EDGE_PORT: 4100
      EDGE_APP_TOKEN: ${EDGE_APP_TOKEN:?Set an EDGE_APP_TOKEN in .env}
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:?Set a custom EDGE_SYNC_TOKEN in .env}
      EDGE_CLOUD_URL: http://cloud:4200
      EDGE_DATA_DIR: /app/data/edge
      EDGE_SEED: 'true'
    ports:
      - '127.0.0.1:4100:4100'
    volumes:
      - edge-data:/app/data
    depends_on: [cloud]
volumes:
  qdrant-data:
  cloud-data:
  edge-data:
